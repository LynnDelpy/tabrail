- id: "1"
  title: Record every command and edit
  description: >-
    A Claude Code hook appends a raw record per command and edit, from every
    session on f4l002, to one central journal (SPEC.md CAP-1,
    journal-records.md).
  invoke_dev_with: >-
    Lives in ~/Dev/vmConfig beside tmux-claude-state (bash, jq), on an lde/
    branch there. Print nothing, never exit non-zero, under 50 ms. Open
    question, journal location: until Lynn decides, write to a local folder
    outside any git repo and commit no journal data. Open question, secret
    scrubbing and retention: leave both out, say so in the summary. Test by
    piping sample hook JSON into the script; wiring it into
    ~/.claude/settings.json touches every live session, so leave that as the
    last step and give Lynn the change instead of making it.
- id: "2"
  title: Distilled entry per task
  description: >-
    After a turn that edited files or ran commands, a small model writes a
    short entry with what, where, versions and pointers, in the background
    (SPEC.md CAP-2, journal-records.md).
  invoke_dev_with: >-
    Stop hook starts it detached; the turn's end must not wait. The
    summarizer's own headless claude run must not trigger the journal hooks
    (an env var the hooks check). Feed it the turn's raw records and only the
    transcript part of that turn.
- id: "3"
  title: Reader chat
  description: >-
    One Claude Code chat set up to answer questions about versions and past
    work from the journal, citing entries (SPEC.md CAP-3).
  invoke_dev_with: >-
    Its own folder in vmConfig with a CLAUDE.md (journal location, record
    format, rules) and a skill that searches the journal by name, version,
    repo and date. Never connects to servers: hand Lynn the command. Its own
    sessions are not journaled. Lynn's fabasoft-infra skill is available to
    it.
- id: "4"
  title: Reader pane under the sidebar
  description: >-
    The reader chat runs in a pane under the sidebar's tab list, follows from
    tab to tab with its conversation, and can be shown and hidden (SPEC.md
    CAP-4, CAP-5).
  invoke_dev_with: >-
    Open question, width: build at the sidebar's width; widening is Lynn's
    call. A tab with only a sidebar and the pane closes like a sidebar-only
    tab, and tabrail-tmux restart must not kill the chat; keep the pane's
    tmux marker apart from @sidebar. Test on a tmux -L server only (AGENTS.md).
