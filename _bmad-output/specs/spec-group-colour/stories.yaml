- id: "1"
  title: Pick a group's colour from its menu
  description: >-
    The group menu's Colour… opens a searchable palette picker with swatches
    and the current one marked, then writes the tint to the group's line in the
    groups file and every sidebar redraws (SPEC.md CAP-1, CAP-2, CAP-3).
  invoke_dev_with: >-
    tabrail-act is at 98 lines: put the popup and pick in its own script, as
    tabrail-move does, and keep one palette list (~28, see SPEC Assumptions)
    that both it and new-group's auto-pick read. Use tabrail-pick's search
    list, not -n (1-9 only); labels may carry ANSI colours (48;2 for the
    swatch). Check each tint for 4.5:1 against #cdd6f4. Cap the popup height
    at the terminal's. Write column 2 like move_group: through the symlink,
    mode kept, renamed into place. No entry for Default. Test on a copy named
    by @tabrail_groups on a tmux -L server, never the user's file.
