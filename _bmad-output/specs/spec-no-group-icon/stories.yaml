- id: "1"
  title: Groups without their icon
  description: >-
    Group rows, Default's included, the Colour… swatches and the Move to group
    list show group names without the groups.conf icon; the name gets its 2
    columns (SPEC.md CAP-1, CAP-2).
  invoke_dev_with: >-
    groups.conf keeps its icon column and New group… keeps writing one. Tests
    that grep a group row by its icon grep the arrow and name instead.
    Nested headers (spec-nested-groups story 1, merged) and Move to group's
    indented list lose the icon too. Test on a tmux -L server only.
