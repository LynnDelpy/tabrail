- id: "1"
  title: Reader bar across the bottom
  description: >-
    The reader pane moves from under the sidebar to a full-width bar at the
    bottom of the tab shown, 4 rows small, 2/3 high while it has the
    keyboard (SPEC.md CAP-1, CAP-2).
  invoke_dev_with: >-
    Bash only (tabrail-reader, tabrail-reader-size, tabrail.tmux), no Rust
    logic change; works with today's claude TUI as the reader command. Test
    with tabrail-reader-test on tmux -L servers, never the user's tmux.
- id: "2"
  title: tabrail-chat, a Claude Code frontend for a few rows
  description: >-
    A second std-only binary that drives claude -p over stream-json: input
    line, streaming answer at full width, tool calls as one line, scroll back
    (SPEC.md CAP-3, CAP-5, CAP-6, the options pass-through of CAP-4).
  invoke_dev_with: >-
    No crates. Test against a fake claude (TABRAIL_CHAT_CLAUDE) in
    tabrail-chat-test on a tmux -L server; one real claude turn on Haiku at
    most, in a scratch folder with --no-session-persistence. Prompts are
    auto-denied (--permission-prompts none).
- id: "4"
  title: Journal reader on the frontend
  description: >-
    ~/Dev/vmConfig/journal-reader/start runs tabrail-chat and its CLAUDE.md
    fits the bar (SPEC.md CAP-4).
  invoke_dev_with: >-
    ~/Dev/vmConfig is its own git repo (github LynnDelpy/vmConfig): branch
    lde/reader-bar there, commit, push, PR. Keep the TUI as fallback while
    tabrail-chat is not built. Never restart the user's reader pane
    yourself; tell Lynn to run tabrail-tmux restart or kill the pane.
- id: "5"
  title: Slot in every tab, grow on double-click
  description: >-
    Tab switches stop resizing the tab's own panes: every tab keeps a 4-row
    slot across the bottom that the reader swaps places with; the bar grows
    to 2/3 only on a double-click into it (SPEC.md CAP-1, CAP-2 as amended).
  invoke_dev_with: >-
    Bash and tmux.conf first; src/ only where the sidebar must ignore the
    slot pane. Test with tabrail-reader-test on tmux -L servers, never the
    user's tmux; split the test file by job if it outgrows 100 lines.
- id: "6"
  title: The bar sizes to the chat, buttons instead of double-click
  description: >-
    The reader bar's height follows tabrail-chat's input and latest answer
    up to a cap, with clickable buttons to make it bigger and smaller; the
    double-click binding, `tabrail-reader grow` and vmConfig's double-click
    branch go (user feedback 2026-11-23; SPEC.md CAP-2 amended).
  invoke_dev_with: >-
    Needs story 2's tabrail-chat. Height changes cost a redraw of every
    Claude in the tab: keep them few (no resize on arrival in a tab). Test
    on tmux -L servers only; vmConfig changes as a patch file.
