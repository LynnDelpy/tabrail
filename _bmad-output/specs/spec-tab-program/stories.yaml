- id: "1"
  title: Claude status only while Claude runs
  description: >-
    A tab whose claude process exited shows as any shell tab, with no status
    left from a stale @claude (SPEC.md CAP-4).
  invoke_dev_with: >-
    model.rs decides Claude from @claude or pane_current_command; make it the
    live process only. Stand-in script named claude on a tmux -L server.
- id: "2"
  title: Program after the tab name
  description: >-
    A dim "· program" after the name while a program runs, skipped when the
    name starts with it, ✳ for a live Claude (SPEC.md CAP-1..3).
  invoke_dev_with: >-
    Needs spec-tab-rows built first (name.rs, draw.rs, row layout). Stand-in
    claude and ssh scripts on a tmux -L server, never a real host.
